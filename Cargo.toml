[package]
name = "celoom"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A closed, Linux-native local AI agent with a remote-capable web interface"
license = "MIT"

[dependencies]
anyhow = "1"
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
argon2 = "0.5"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
eventsource-stream = "0.2"
futures-util = "0.3"
globset = "0.4"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
scraper = "0.24"
regex = "1"
mime_guess = "2"
notify = "8"
nix = { version = "0.30", features = ["signal", "process", "fs"] }
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "socks"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = { version = "8", features = ["include-exclude", "debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio-tungstenite = "0.28"
wayland-client = "0.31"
wayland-scanner = "0.31"
wayland-backend = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 16
debug = false
strip = true
